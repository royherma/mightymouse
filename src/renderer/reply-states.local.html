<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Reply window states</title>
    <style>
      body { margin: 0; padding: 16px 24px; background: #e9e6e1; font: 13px -apple-system, sans-serif; color: #333; }
      h1 { margin: 0 0 12px; font-size: 16px; }
      .grid { display: grid; grid-template-columns: repeat(3, 420px); gap: 18px 22px; align-items: end; }
      figure { margin: 0; }
      figcaption { margin-bottom: 5px; color: #666; }
      iframe { display: block; width: 420px; border: 0; border-radius: 12px; box-shadow: 0 10px 28px rgba(0,0,0,.22), 0 0 0 1px rgba(0,0,0,.1); background: #fff; }
    </style>
  </head>
  <body>
    <h1>Floating reply window - every state at its real size (420 wide)</h1>
    <div class="grid" id="grid"></div>
    <script>
      const P = 'new=/Users/roy/Development/ShowAndTell'
      const ICON = encodeURIComponent('data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><rect width="16" height="16" rx="3" fill="#0a66c2"/><text x="3" y="12.5" font-size="11" font-family="Arial" font-weight="700" fill="#fff">in</text></svg>'))
      const states = [
        ['New agent, site with a favicon, 190px', `${P}&page=www.linkedin.com/feed/foryou&icon=${ICON}`, 190],
        ['New agent, local page, no favicon, 190px', `${P}&page=showandtell-demoengines.localhost`, 190],
        ['New agent, long address, 190px', `${P}&page=applications-hq.techguyver1337.workers.dev/jobs/2026/outreach/people&icon=${ICON}`, 190],
        ['Reply to an agent, 190px', 'aim=s1', 190],
        ['New agent, 320px', `${P}&page=www.linkedin.com/feed/foryou&icon=${ICON}`, 320],
        ['Reply to an agent, 320px', 'aim=s1', 320]
      ]
      document.getElementById('grid').innerHTML = states
        .map(([name, q, h]) => `<figure><figcaption>${name}</figcaption><iframe style="height:${h}px" src="/reply-harness.local.html?${q}&fill=1"></iframe></figure>`)
        .join('')
    </script>
  </body>
</html>
