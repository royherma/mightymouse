<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Phone screens</title>
<style>
  :root {
    --bg: #f6f3ee; --ink: #1d1b19; --dim: #7a736b; --line: #e3ddd4; --accent: #f08a3c;
    --card: #fff; --bad: #d4453a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 16px 24px 8px; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; }
  .bar { display: flex; gap: 8px; margin-left: auto; }
  .bar button { border: 1px solid var(--line); background: var(--card); border-radius: 8px;
    padding: 6px 12px; font: inherit; cursor: pointer; }
  .bar button[aria-pressed='true'] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .flow { padding: 4px 24px 12px; color: var(--dim); font-size: 13px; }
  .flow b { color: var(--ink); font-weight: 600; }
  .flow .arrow { color: var(--accent); font-weight: 700; padding: 0 4px; }
  .row { display: flex; gap: 20px; padding: 8px 24px 20px; overflow-x: auto; align-items: flex-start; }
  .cell { flex: 0 0 auto; }
  .cap { font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; margin: 0 0 2px; }
  .how { font-size: 12px; color: var(--dim); margin: 0 0 8px; min-height: 17px; }
  h2 { font-size: 13px; margin: 8px 24px 0; color: var(--dim); font-weight: 600; }
  .back { font-size: 12px; color: var(--accent); margin: -6px 0 8px; font-weight: 600; }
  .how.bad { color: var(--bad); font-weight: 600; }
  .phone { position: relative; overflow: hidden; border-radius: 28px; background: #000;
    box-shadow: 0 10px 30px -12px rgba(0,0,0,.35); }
  .phone .scaler { transform-origin: 0 0; }
  .phone iframe { border: 0; display: block; background: #fff; }
  .err { padding: 24px; color: var(--bad); font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1>Phone screens</h1>
  <div class="bar">
    <button type="button" data-scale="0.6">60%</button>
    <button type="button" data-scale="0.75">75%</button>
    <button type="button" data-scale="1">100%</button>
    <button type="button" id="reload">Reload</button>
  </div>
</header>
<div class="flow" id="flow"></div>
<div id="rows"></div>
<script type="module" src="./screens.js"></script>
</body>
</html>
